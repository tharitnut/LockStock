name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: lockstock_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare test database
        run: |
          node -e "import('pg').then(async ({ Client }) => {
            const client = new Client('postgresql://postgres:postgrespassword@localhost:5432/postgres');
            await client.connect();
            await client.query('CREATE DATABASE lockstock_test;');
            await client.end();
            console.log('Test database lockstock_test created.');
          });"

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/lockstock_dev
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/lockstock_test
          JWT_SECRET: ci_test_environment_secret_key_at_least_32_characters_long
          DB_POOL_MAX: 20
          DEMO_ENABLED: false
